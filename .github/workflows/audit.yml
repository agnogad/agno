name: audit

# A vulnerability is published against a version, not against a commit, so a
# weekly run catches one that landed after the last push. Pushes to main still
# check the graph that is actually being shipped.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # One pass over advisories, licences, sources and bans. This replaced
      # `cargo audit`, which only failed on a vulnerability and merely warned
      # about an unmaintained crate - and agno inherits three of those from
      # syntect and serde_yaml_ng. deny.toml names each one with its reason,
      # so a fourth would fail the build instead of scrolling past in a log.
      - run: cargo deny check
