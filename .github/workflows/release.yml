name: release

# Tagging `v0.3.2` builds the binary on every platform, packages it with the
# README and the licence, and attaches the archives to the GitHub release.
# `workflow_dispatch` runs the same build without touching any release, so the
# packaging can be checked without inventing a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled from the arm64 runner: the macOS SDK and clang
          # handle both architectures, and rustup supplies the std for the
          # other one.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Fully static, so the download works on any distribution rather than
          # only on glibc 2.34 and newer. Two differences from the other
          # targets: the pure-Rust regex engine, because Oniguruma serialises on
          # a global lock that musl handles badly (0.21s on one thread, 0.72s on
          # twelve - see the README), and musl-gcc for mimalloc, which is C.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            packages: musl-tools
            flags: --no-default-features --features fancy
    steps:
      - uses: actions/checkout@v7

      - name: apt packages
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.flags }}

      - name: stage the archive contents
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          name="agno-${version}-${{ matrix.target }}"
          echo "NAME=$name" >> "$GITHUB_ENV"

          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/agno.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/agno" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"

      - name: tar.gz
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"

      - name: zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:NAME" -DestinationPath "dist/$env:NAME.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: gh release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # -R everywhere: this job deliberately has no checkout, and without it
          # gh tries to work out the repository from the current directory and
          # dies with "fatal: not a git repository".
          repo="$GITHUB_REPOSITORY"
          gh release view "$tag" -R "$repo" >/dev/null 2>&1 \
            || gh release create "$tag" -R "$repo" --title "$tag" --generate-notes
          gh release upload "$tag" dist/* -R "$repo" --clobber
          gh release view "$tag" -R "$repo" --json assets --jq '.assets[].name'
