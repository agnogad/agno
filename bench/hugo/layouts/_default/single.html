{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{ if .Date }}<p class="meta"><time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time>{{ range .Params.tags }} · <a href="/tags/{{ . | urlize }}/">{{ . }}</a>{{ end }}</p>{{ end }}
  <div class="content">{{ .Content }}</div>
</article>
{{ end }}
