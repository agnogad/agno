{{ define "main" }}
{{ .Content }}
<ul class="post-list">
  {{ range .Site.RegularPages }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ if .Date }}<time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time>{{ end }}
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}
