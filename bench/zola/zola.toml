base_url = "https://example.com"
title = "Bench"
description = "A site built with agno"
default_language = "en"
output_dir = "public"

taxonomies = [{ name = "tags" }]
generate_feeds = true
feed_filenames = ["atom.xml"]
feed_limit = 20
generate_sitemap = true
generate_robots_txt = true

[markdown]
smart_punctuation = true

[markdown.highlighting]
theme = "github-dark"
