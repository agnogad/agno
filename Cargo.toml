[package]
name = "agno"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
description = "A fast, content-first static site generator"
license = "MIT"
repository = "https://github.com/agnogad/agno"
homepage = "https://github.com/agnogad/agno"
readme = "README.md"
keywords = ["static-site", "ssg", "markdown", "blog", "jinja"]
categories = ["command-line-utilities", "web-programming"]
include = [
    "/src/**",
    "/theme/**",
    "/tests/**",
    "/assets/screenshot.png",
    "/README.md",
    "/LICENSE",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
minijinja = { version = "3", features = ["serde", "speedups"] }
notify = "8"
pulldown-cmark = "0.13"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
syntect = { version = "5", default-features = false, features = ["default-onig"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tiny_http = "0.12"
toml = "1"
walkdir = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
