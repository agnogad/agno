[package]
name = "agno"
version = "0.3.7"
edition = "2024"
rust-version = "1.88"
description = "A fast, content-first static site generator"
license = "MIT"
repository = "https://github.com/agnogad/agno"
homepage = "https://github.com/agnogad/agno"
readme = "README.md"
keywords = ["static-site", "ssg", "markdown", "blog", "jinja"]
categories = ["command-line-utilities", "web-programming"]
include = [
    "/src/**",
    "/theme/**",
    "/tests/**",
    "/assets/screenshot.png",
    "/README.md",
    "/LICENSE",
]

[features]
default = ["onig"]
# Which regex engine syntect uses to highlight code. `onig` is Oniguruma, C,
# and about twice as fast; `fancy` is pure Rust and about twice as slow, but it
# scales across threads, which Oniguruma does not: it serialises on a global
# lock that glibc's mutex absorbs and musl's does not. The static Linux build
# ships `fancy` for that reason - see the release workflow. Both emit identical
# HTML.
onig = ["syntect/default-onig"]
fancy = ["syntect/default-fancy"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
minijinja = { version = "3", features = ["serde", "speedups"] }
notify = "8"
pulldown-cmark = "0.13"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Frontmatter. It drags in unsafe-libyaml, which RustSec flags as
# unmaintained (no vulnerability, see deny.toml); swapping the parser changes
# the accepted YAML dialect, so that is a deliberate change with its own
# tests, not a version bump.
serde_yaml_ng = "0.10"
syntect = { version = "5", default-features = false }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tiny_http = "0.12"
toml = "1"
walkdir = "2"

# Only the musl build. There it is not tuning: musl's malloc takes a global
# lock, so the static build went 0.40s on one thread to 1.07s on twelve, and
# mimalloc brings that to 0.14s.
#
# It is not used elsewhere because it costs 3-5x the peak RSS for no reliable
# speed: measured against glibc on the same fixtures, 1000 posts/code was 12%
# *slower* (60ms vs 54ms, 93MB vs 19MB) and 3000 posts/heavy 8% faster
# (292ms vs 317ms, 141MB vs 49MB). Low memory is one of agno's claims, so the
# gnu, macOS and Windows builds keep the system allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
