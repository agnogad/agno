{% extends "base.html" %}
{% block content %}
<article>
  <h1>{{ page.title }}</h1>
  {% if page.date %}
  <p class="meta">
    <time datetime="{{ page.datetime }}">{{ page.date }}</time>
    {% for tag in page.tags %} · <a href="/tags/{{ tag|slugify }}/">{{ tag }}</a>{% endfor %}
  </p>
  {% endif %}
  <div class="content">{{ page.content|safe }}</div>
</article>
{% endblock %}
