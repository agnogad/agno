{% extends "base.html" %}
{% block content %}
{% if page.content %}<div class="content">{{ page.content|safe }}</div>{% endif %}
<ul class="post-list">
  {% for item in pages %}
  <li>
    <a href="{{ item.url }}">{{ item.title }}</a>
    {% if item.date %}<time datetime="{{ item.datetime }}">{{ item.date }}</time>{% endif %}
    {% if item.summary %}<p>{{ item.summary }}</p>{% endif %}
  </li>
  {% endfor %}
</ul>
{% endblock %}
