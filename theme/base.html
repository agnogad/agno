<!doctype html>
<html lang="{{ site.language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ page.title }}{% if page.title != site.title %} · {{ site.title }}{% endif %}{% endblock %}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
  <meta property="og:title" content="{{ page.title }}">
  {% if page.description %}<meta property="og:description" content="{{ page.description }}">{% endif %}
  <meta property="og:url" content="{{ site.base_url }}{{ page.url }}">
  <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  {% if page.extra.image %}<meta property="og:image" content="{% if page.extra.image is startingwith "http" or page.extra.image is startingwith "//" %}{{ page.extra.image }}{% else %}{{ site.base_url }}{% if page.extra.image is not startingwith "/" %}/{% endif %}{{ page.extra.image }}{% endif %}">{% endif %}
  <meta name="twitter:card" content="{% if page.extra.image %}summary_large_image{% else %}summary{% endif %}">
  <link rel="stylesheet" href="/style.css">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="/rss.xml">
  <link rel="canonical" href="{{ site.base_url }}{{ page.url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">{{ site.title }}</a>
    <nav>
      {% for item in site.menu %}<a href="{{ item.url }}">{{ item.title }}</a>{% endfor %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>© {{ site.year }} {{ site.title }} · <a href="/rss.xml">RSS</a></footer>
</body>
</html>
